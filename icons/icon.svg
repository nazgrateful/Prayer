      <path d="M264 300 C276 316 290 330 300 350" fill="none" stroke="#1d2440" stroke-width="7" stroke-linecap="round" opacity=".55"/>
      <path d="M270 232 L284 236 M266 262 L290 268" fill="none" stroke="#1d2440" stroke-width="6" stroke-linecap="round" opacity=".35"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="256" cy="250" r="190" fill="url(#glow)" opacity=".55"/>
  <circle cx="256" cy="250" r="118" fill="#ffd98a"/>
  <g stroke="#ffd98a" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="96" x2="256" y2="62"/>
    <line x1="140" y1="138" x2="114" y2="112"/>
    <line x1="372" y1="138" x2="398" y2="112"/>
    <line x1="92" y1="250" x2="58" y2="250"/>
    <line x1="420" y1="250" x2="454" y2="250"/>
  </g>
  <path d="M0 400 H512 V400 Q512 512 400 512 H112 Q0 512 0 400 Z" fill="#1d2440" opacity=".92"/>
  <use href="#hand"/>
  <use href="#hand" transform="translate(512 0) scale(-1 1)"/>
  <line x1="256" y1="160" x2="256" y2="440" stroke="#1d2440" stroke-width="6" stroke-linecap="round"/>
</svg>
